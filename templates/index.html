<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GET MY LOOK · Neta Hornik Makeup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&family=Frank+Ruhl+Libre:wght@300;400;500;700&family=Heebo:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --ink: #141414;
      --paper: #faf9f7;
      --card: #ffffff;
      --line: #dcd8d2;
      --muted: #6f6a64;
      --soft: #f3f1ee;
    }

    body {
      margin: 0;
      font-family: "Heebo", Arial, sans-serif;
      background:
        radial-gradient(1200px 600px at 85% -100px, #f1ede8 0%, transparent 60%),
        radial-gradient(1000px 500px at 0% 100%, #eeebe6 0%, transparent 55%),
        var(--paper);
      color: var(--ink);
      direction: rtl;
    }

    /* soft diagonal studio-light beams, like the reference photo */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        linear-gradient(115deg, rgba(255,255,255,0) 26%, rgba(255,255,255,0.65) 36%, rgba(255,255,255,0) 50%),
        linear-gradient(115deg, rgba(228,222,214,0) 55%, rgba(228,222,214,0.35) 66%, rgba(228,222,214,0) 78%);
    }

    /* marble & brushes photo anchored to the bottom of the viewport */
    body::after {
      content: "";
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: min(34vh, 360px);
      z-index: -1;
      pointer-events: none;
      background-image:
        linear-gradient(to bottom, rgba(250,249,247,1) 0%, rgba(250,249,247,0.8) 45%, rgba(250,249,247,0.45) 100%),
        url("assets/backdrop.jpg");
      background-size: cover;
      background-position: center bottom;
    }

    /* ---------- header ---------- */
    .hero {
      padding: 52px 24px 36px;
      text-align: center;
    }

    .logo {
      display: block;
      width: min(420px, 88vw);
      height: auto;
      margin: -30px auto -40px; /* the original file carries transparent padding */
    }

    .hero-rule {
      width: 46px;
      border: none;
      border-top: 1px solid var(--ink);
      margin: 26px auto;
    }

    .brand {
      font-family: "Playfair Display", serif;
      font-weight: 400;
      font-size: clamp(42px, 9vw, 84px);
      letter-spacing: 0.04em;
      color: var(--ink);
      margin: 0;
      direction: ltr;
    }

    .hero .tagline {
      font-family: "Frank Ruhl Libre", serif;
      margin: 18px auto 0;
      color: #3d3a36;
      font-size: clamp(16px, 3vw, 20px);
      max-width: 560px;
      line-height: 1.5;
    }

    /* ---------- layout: sidebar + content ---------- */
    .layout {
      display: flex;
      max-width: 1300px;
      margin: 0 auto;
      align-items: flex-start;
      gap: 28px;
      padding: 10px 24px 70px;
    }

    .sidebar {
      width: 230px;
      flex-shrink: 0;
      position: sticky;
      top: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-top: 26px;
      border-top: 1px solid var(--line);
    }

    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      border: 1.5px solid var(--ink);
      background: var(--card);
      color: var(--ink);
      padding: 14px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
      font-size: 16px;
      font-weight: 500;
      transition: 0.2s ease;
    }

    .nav-btn:hover {
      background: var(--soft);
      transform: translateY(-2px);
    }

    .nav-btn.active {
      background: var(--ink);
      color: white;
    }

    .content {
      flex: 1;
      min-width: 0;
      padding-top: 26px;
      border-top: 1px solid var(--line);
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .section-title {
      font-family: "Frank Ruhl Libre", serif;
      color: var(--ink);
      font-size: clamp(28px, 5vw, 40px);
      font-weight: 700;
      margin: 0 0 6px;
      text-align: center;
    }

    .section-sub {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 15px;
      text-align: center;
    }

    /* ---------- products page ---------- */
    .categories {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 18px 0 28px;
    }

    .category-btn {
      border: 1.5px solid var(--ink);
      background: var(--card);
      color: var(--ink);
      padding: 10px 22px;
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
      font-size: 15px;
      font-weight: 500;
      transition: 0.2s ease;
    }

    .category-btn:hover {
      background: var(--soft);
      transform: translateY(-2px);
    }

    .category-btn.active {
      background: var(--ink);
      color: white;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 22px;
    }

    .product-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 30px rgba(20, 20, 20, 0.1);
    }

    .product-card img {
      width: 100%;
      height: 230px;
      object-fit: cover;
      background: var(--soft);
    }

    .product-content {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      border-top: 1px solid var(--line);
    }

    .product-content h3 {
      margin: 0;
      font-family: "Frank Ruhl Libre", serif;
      color: var(--ink);
      font-size: 17px;
      font-weight: 500;
      line-height: 1.35;
    }

    .category-tag {
      align-self: flex-start;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      padding-bottom: 3px;
    }

    .buy-btn {
      display: inline-block;
      margin-top: auto;
      padding: 11px 14px;
      background: transparent;
      border: 1.5px solid var(--ink);
      color: var(--ink);
      text-decoration: none;
      border-radius: 999px;
      text-align: center;
      font-weight: 500;
      transition: 0.2s ease;
    }

    .buy-btn:hover {
      background: var(--ink);
      color: white;
    }

    .empty-state {
      margin-top: 20px;
      padding: 18px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--muted);
    }

    /* ---------- looks page ---------- */
    .looks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 22px;
      align-items: start;
    }

    .look-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .look-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 30px rgba(20, 20, 20, 0.12);
    }

    .look-card > img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      display: block;
    }

    .look-info {
      padding: 14px 16px;
      border-top: 1px solid var(--line);
    }

    .look-title {
      font-family: "Frank Ruhl Libre", serif;
      font-weight: 700;
      font-size: 18px;
      color: var(--ink);
    }

    .look-hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
    }

    .id-card {
      display: none;
      padding: 0 14px 14px;
      font-size: 14px;
    }

    .id-card.open {
      display: block;
    }

    .id-card-title {
      font-weight: 600;
      color: var(--ink);
      margin: 4px 0 10px;
      border-top: 1px dashed var(--line);
      padding-top: 12px;
      font-size: 13px;
      letter-spacing: 0.04em;
    }

    .id-card-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--soft);
      border-radius: 4px;
      padding: 9px;
      margin-bottom: 8px;
    }

    .id-card-item img {
      width: 46px;
      height: 46px;
      border-radius: 4px;
      object-fit: cover;
      background: white;
      flex-shrink: 0;
    }

    .id-card-item .item-text {
      flex: 1;
      min-width: 0;
    }

    .id-card-item .item-name {
      font-weight: 500;
      font-size: 13px;
      color: var(--ink);
    }

    .id-card-item .item-category {
      font-size: 12px;
      color: var(--muted);
    }

    .id-card-item a {
      font-size: 12px;
      background: transparent;
      border: 1px solid var(--ink);
      color: var(--ink);
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 999px;
      white-space: nowrap;
      font-weight: 500;
      transition: 0.2s ease;
    }

    .id-card-item a:hover {
      background: var(--ink);
      color: white;
    }

    /* ---------- mobile ---------- */
    @media (max-width: 760px) {
      .hero {
        padding-top: 40px;
      }

      .layout {
        flex-direction: column;
        padding: 10px 16px 50px;
        gap: 18px;
      }

      .sidebar {
        position: sticky;
        top: 0;
        z-index: 50;
        width: 100%;
        flex-direction: row;
        background: var(--paper);
        padding: 12px 0;
      }

      .nav-btn {
        padding: 12px 10px;
        font-size: 15px;
      }

      .content {
        border-top: none;
        padding-top: 0;
      }

      .product-card img {
        height: 200px;
      }

      .look-card > img {
        height: 260px;
      }
    }
  </style>
</head>
<body>
  <header class="hero">
    <h1 style="margin:0;"><img class="logo" src="assets/logo.webp" alt="Neta Hornik Bridal Makeup"></h1>
    <hr class="hero-rule">
    <p class="brand">GET MY LOOK</p>
    <p class="tagline">כל המוצרים שאני עובדת איתם במקום אחד</p>
  </header>

  <div class="layout">
    <nav class="sidebar" aria-label="ניווט ראשי">
      <button class="nav-btn active" data-page="products">מוצרים מומלצים</button>
      <button class="nav-btn" data-page="looks">לוקים של כלות</button>
    </nav>

    <div class="content">
      <!-- products page -->
      <section class="page active" id="page-products">
        <h2 class="section-title">המוצרים המומלצים שלי</h2>
        <p class="section-sub">בחרי קטגוריה כדי לסנן, ולחצי על לקנייה כדי לעבור לחנות.</p>

        <div class="categories" id="categoryButtons"></div>
        <div class="products-grid" id="productGrid"></div>
        <div class="empty-state" id="emptyState" style="display:none;"></div>
      </section>

      <!-- looks page -->
      <section class="page" id="page-looks">
        <h2 class="section-title">לוקים של כלות</h2>
        <p class="section-sub">לחצי על תמונה כדי לפתוח את תעודת הזהות של הלוק – כל המוצרים שהשתמשתי בהם.</p>

        <div class="looks-grid" id="lookList"></div>
      </section>
    </div>
  </div>

  <script>
    const API_BASE = "";

    let looks = [];
    let products = [];
    let activeCategory = "";

    async function fetchJSON(path) {
      const res = await fetch(API_BASE + path);
      if (!res.ok) throw new Error(`Failed to fetch ${path}`);
      return res.json();
    }

    function escapeHtml(value) {
      const div = document.createElement("div");
      div.textContent = value ?? "";
      return div.innerHTML;
    }

    /* ---------- page navigation ---------- */
    document.querySelectorAll(".nav-btn").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
        document.getElementById(`page-${btn.dataset.page}`).classList.add("active");
      };
    });

    /* ---------- products ---------- */
    function renderCategories() {
      const container = document.getElementById("categoryButtons");
      container.innerHTML = "";

      const categories = ["הכל", ...new Set(products.map(p => p.category).filter(Boolean))];

      categories.forEach(category => {
        const btn = document.createElement("button");
        btn.className = "category-btn" + (category === activeCategory ? " active" : "");
        btn.textContent = category;
        btn.onclick = () => {
          activeCategory = category;
          document.querySelectorAll(".category-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          renderProducts();
        };
        container.appendChild(btn);
      });
    }

    function renderProducts() {
      const grid = document.getElementById("productGrid");
      const emptyState = document.getElementById("emptyState");
      grid.innerHTML = "";

      const filtered = activeCategory === "הכל"
        ? products
        : products.filter(p => p.category === activeCategory);

      if (filtered.length === 0) {
        emptyState.style.display = "block";
        emptyState.textContent = "אין מוצרים בקטגוריה הזו כרגע.";
        return;
      }

      emptyState.style.display = "none";

      filtered.forEach(product => {
        const card = document.createElement("div");
        card.className = "product-card";
        card.innerHTML = `
          <img src="${escapeHtml(product.image)}" alt="${escapeHtml(product.name)}" loading="lazy">
          <div class="product-content">
            ${product.category ? `<span class="category-tag">${escapeHtml(product.category)}</span>` : ""}
            <h3>${escapeHtml(product.name)}</h3>
            <a class="buy-btn" href="${escapeHtml(product.link || "#")}" target="_blank" rel="noopener noreferrer">לקנייה</a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    /* ---------- looks (bride photos + ID cards) ---------- */
    function renderLooks() {
      const container = document.getElementById("lookList");
      container.innerHTML = "";

      looks.forEach((look, index) => {
        const card = document.createElement("div");
        card.className = "look-card";

        const items = look.products.map(p => `
          <div class="id-card-item">
            ${p.image ? `<img src="${escapeHtml(p.image)}" alt="" loading="lazy">` : ""}
            <div class="item-text">
              <div class="item-name">${escapeHtml(p.name)}</div>
              ${p.category ? `<div class="item-category">${escapeHtml(p.category)}</div>` : ""}
            </div>
            ${p.link ? `<a href="${escapeHtml(p.link)}" target="_blank" rel="noopener noreferrer">לקנייה</a>` : ""}
          </div>
        `).join("");

        card.innerHTML = `
          <img src="${escapeHtml(look.photo)}" alt="${escapeHtml(look.description) || `לוק ${index + 1}`}" loading="lazy">
          <div class="look-info">
            <div class="look-title">${escapeHtml(look.description) || `לוק ${index + 1}`}</div>
            <div class="look-hint">לחצי לפרטי המוצרים ▾</div>
          </div>
          <div class="id-card" id="id-card-${index}">
            <div class="id-card-title">מוצרים בלוק הזה</div>
            ${items || "<div>לא צוינו מוצרים.</div>"}
          </div>
        `;

        card.addEventListener("click", (event) => {
          if (event.target.closest("a")) return;
          const idCard = document.getElementById(`id-card-${index}`);
          const wasOpen = idCard.classList.contains("open");
          document.querySelectorAll(".id-card").forEach(el => el.classList.remove("open"));
          if (!wasOpen) idCard.classList.add("open");
        });

        container.appendChild(card);
      });
    }

    async function init() {
      try {
        const [looksData, productsData] = await Promise.all([
          fetchJSON("/artists"),
          fetchJSON("/products")
        ]);

        looks = looksData;
        products = productsData;
        activeCategory = "הכל";

        renderCategories();
        renderProducts();
        renderLooks();
      } catch (err) {
        const emptyState = document.getElementById("emptyState");
        emptyState.style.display = "block";
        emptyState.textContent = "אירעה שגיאה בטעינת הנתונים. בדקי שהגיליונות משותפים לצפייה ציבורית.";
        console.error(err);
      }
    }

    init();
  </script>
</body>
</html>
